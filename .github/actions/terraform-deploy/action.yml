name: 'Terraform Deploy'
description: 'Deploys an Nx project to GCP via Terraform'
inputs:
  nx_project:
    description: 'Name of the Nx project to deploy'
    required: true
    type: string
  gcp_sa_key:
    description: 'GCP Service Account Key JSON'
    required: true
    type: string
  gcp_project_id:
    description: 'GCP Project ID'
    required: false
    type: string
    default: 'bubaxi'
  gcp_region:
    description: 'GCP Region for deployment'
    required: false
    type: string
    default: 'us-central1'
  setup_firebase:
    description: 'Whether to setup Firebase cli'
    required: false
    type: boolean
    default: false
  cloudflare_api_token:
    description: 'Cloudflare API Token for custom domain setup'
    required: false
    type: string

runs:
  using: 'composite'
  steps:

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.gcp_sa_key }}
        project_id: ${{ inputs.gcp_project_id }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Install firebase cli
      if: ${{ inputs.setup_firebase == 'true' }}
      shell: bash
      run: |
        npm install -g firebase-tools

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform init
      working-directory: infra/${{ inputs.nx_project }}
      shell: bash
      run: |
        terraform init \
          -backend-config="bucket=bubaxi-tf-state" \
          -backend-config="prefix=${{ inputs.nx_project }}"

    - name: Terraform plan
      working-directory: infra/${{ inputs.nx_project }}
      shell: bash
      run: |
        # Source the environment file if it exists
        if [ -f ../../.env ]; then
          set -a  # automatically export all variables
          source ../../.env
          set +a
        fi

        terraform plan \
          -var="project_id=${{ inputs.gcp_project_id }}" \
          -var="region=${{ inputs.gcp_region }}" \
          -var="app_name=${{ inputs.nx_project }}" \
          -var="build_dir=dist/apps/${{ inputs.nx_project }}" \
          -out=tfplan
      env:
        TF_VAR_cloudflare_api_token: ${{ inputs.cloudflare_api_token }}

    - name: Terraform apply
      working-directory: infra/${{ inputs.nx_project }}
      shell: bash
      run: |
        # Source the environment file if it exists
        if [ -f ../../.env ]; then
          set -a  # automatically export all variables
          source ../../.env
          set +a
        fi

        terraform apply -auto-approve tfplan
      env:
        TF_VAR_cloudflare_api_token: ${{ inputs.cloudflare_api_token }}
