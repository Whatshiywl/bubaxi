<mat-drawer-container class="drawer-container">
  <mat-drawer mode="side" opened>
    <form class="app-form" [formGroup]="appProps">
      <div class="form-element">
        <mat-label>Error Rate: {{appProps.get('errorRate')?.value}}%</mat-label>
        <mat-slider (input)="setSlider('errorRate', $event.value || 0)" min="0" max="1" step="0.01" #errorSlider></mat-slider>
      </div>
      <div class="form-element">
        <mat-label>SLO: {{appProps.get('SLO')?.value}}%</mat-label>
        <mat-slider (input)="setSlider('SLO', $event.value || 0, true)" min="0" max="1" step="0.01" #sloSlider></mat-slider>
      </div>
      <div class="form-element">
        <mat-label>SLA: {{appProps.get('SLA')?.value}}%</mat-label>
        <mat-slider (input)="setSlider('SLA', $event.value || 0, true)" min="0" max="1" step="0.01" #slaSlider></mat-slider>
      </div>
    </form>
  </mat-drawer>
  <mat-drawer-content id="interactive-content">
    <div class="charts">
      <canvas baseChart
        [datasets]="availabilityData"
        [labels]="lineChartLabels"
        [options]="availabilityOptions"
        [colors]="lineChartColors"
        [legend]="lineChartLegend"
        [chartType]="lineChartType"
        [plugins]="lineChartPlugins">
      </canvas>
      <canvas baseChart
        [datasets]="errorBudgetData"
        [labels]="lineChartLabels"
        [options]="errorBudgetOptions"
        [colors]="lineChartColors"
        [legend]="lineChartLegend"
        [chartType]="lineChartType"
        [plugins]="lineChartPlugins">
      </canvas>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
