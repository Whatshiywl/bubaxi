<form [formGroup]="searchForm">
  <input type="text" name="text-search" id="text-search" formControlName="text">
</form>
<input type="file" name="csv-input" id="csv-input" (change)="onFileInput($event)">
<button (click)="uploadSongs()">upload</button>
<div style="display: flex; flex-direction: column;">
  <div *ngFor="let item of results" style="border: 1px solid black;">{{item}}</div>
</div>
